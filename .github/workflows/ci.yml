name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-types:
    name: Lint + Types + Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests (vitest)
        run: npm test
        env:
          AUTH_SECRET: ci-only-secret-not-used-for-real-data-ever-please

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-and-types

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: helpdesk_ci
          POSTGRES_DB: helpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helpdesk -d helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://helpdesk:helpdesk_ci@localhost:5432/helpdesk?schema=public
      AUTH_SECRET: ci-only-secret-not-used-for-real-data-ever-please
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      NODE_ENV: test
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Seed DB
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run E2E
        run: |
          npm start &
          npx wait-on http://localhost:3000 -t 60000
          PLAYWRIGHT_BASE_URL=http://localhost:3000 PLAYWRIGHT_NO_SERVER=1 npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
