# Evolution API (WhatsApp) — stack independiente para el VPS.
#
# Coexiste con tus servicios actuales (automotive-*, quantum-*, helpdesk-*).
# Todo queda en loopback (127.0.0.1); exponé Evolution con tu Nginx existente
# en un subdominio (ej. evolution.linetechinformatica.com) con certbot.
#
# Uso:
#   1) cp .env.evolution.example .env   (y completá EVOLUTION_API_KEY con algo largo y aleatorio)
#   2) docker compose -f docker-compose.evolution.yml up -d
#   3) En el panel del helpdesk → Configuración → WhatsApp:
#        URL = https://evolution.linetechinformatica.com
#        API key = el valor de EVOLUTION_API_KEY
#
# Generá una API key fuerte:  openssl rand -hex 32

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      # --- servidor ---
      SERVER_URL: ${EVOLUTION_SERVER_URL:-https://evolution.linetechinformatica.com}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?Definí EVOLUTION_API_KEY en .env}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DEL_INSTANCE: "false"
      LANGUAGE: es
      # --- base de datos (Postgres dedicado de Evolution) ---
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:-evolution}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # --- cache Redis ---
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    depends_on:
      evolution-postgres:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - evolution

  evolution-postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD:-evolution}
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - evolution

  evolution-redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data
    networks:
      - evolution

volumes:
  evolution_instances:
  evolution_pgdata:
  evolution_redis:

networks:
  evolution:
    name: evolution
