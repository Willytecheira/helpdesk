# Bloque Nginx para exponer Evolution API en un subdominio con HTTPS.
# Colocalo junto a tu config del helpdesk y luego:
#   certbot --nginx -d evolution.linetechinformatica.com
#
# Evolution corre en 127.0.0.1:8080 (ver docker-compose.evolution.yml).

server {
    listen 80;
    server_name evolution.linetechinformatica.com;

    # certbot completará el redirect a HTTPS automáticamente.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evolution usa WebSocket para algunos eventos
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # WhatsApp puede enviar medios; subí el límite
        client_max_body_size 50M;
        proxy_read_timeout 600s;
    }
}
