# Server block de Nginx para el Helpdesk.
# Copialo a /etc/nginx/sites-available/helpdesk y enlazá a sites-enabled.
# Asume que el helpdesk corre en 127.0.0.1:3200 (APP_PORT).
#
# Pasos:
#   1. sudo cp docker/nginx-helpdesk.conf /etc/nginx/sites-available/helpdesk
#   2. editá server_name con tu subdominio
#   3. sudo ln -s /etc/nginx/sites-available/helpdesk /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
#   5. sudo certbot --nginx -d helpdesk.tudominio.com   (agrega el bloque 443 + TLS)

server {
    listen 80;
    listen [::]:80;
    server_name helpdesk.tudominio.com;

    # Subida de adjuntos hasta 30 MB
    client_max_body_size 30M;

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;

        # Headers necesarios para Auth.js y para el rate-limit por IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Soporte de upgrade (no usamos websockets, pero por las dudas)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
    }

    # El chat IA usa streaming (SSE): desactivar buffering para que llegue token a token
    location /api/ai/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }
}
